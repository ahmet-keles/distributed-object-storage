spring.application.name=storage-node

server.port=${STORAGE_NODE_PORT:9000}

# Where this node keeps its chunk files. Each node process must own its own
# directory; two nodes sharing one directory would silently be one node.
storage.node.data-dir=${STORAGE_NODE_DATA_DIR:./data}

# Chunk uploads arrive as raw bytes; cap them just above the coordinator's
# chunk size so a misconfigured client cannot buffer arbitrary payloads here.
spring.servlet.multipart.enabled=false
server.max-http-request-header-size=16KB

management.endpoints.web.exposure.include=health
