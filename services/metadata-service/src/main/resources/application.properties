spring.application.name=metadata-service

server.port=${METADATA_PORT:8080}

spring.datasource.url=jdbc:postgresql://${METADATA_POSTGRES_HOST:127.0.0.1}:${METADATA_POSTGRES_PORT:5433}/${METADATA_POSTGRES_DB:objectstore}
spring.datasource.username=${METADATA_POSTGRES_USER:objectstore_user}
spring.datasource.password=${METADATA_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health,info

# Storage policy. Chunk size and replication factor apply to NEW uploads;
# existing objects keep the values recorded in their metadata.
storage.chunk-size-bytes=${STORAGE_CHUNK_SIZE_BYTES:1048576}
storage.replication-factor=${STORAGE_REPLICATION_FACTOR:2}
storage.max-object-size-bytes=${STORAGE_MAX_OBJECT_SIZE_BYTES:67108864}

# Static cluster membership: ids must be unique and stable — replica
# locations are recorded against them. Defaults match compose.yaml.
storage.nodes[0].id=${STORAGE_NODES_0_ID:node-1}
storage.nodes[0].base-url=${STORAGE_NODES_0_BASE_URL:http://localhost:9001}
storage.nodes[1].id=${STORAGE_NODES_1_ID:node-2}
storage.nodes[1].base-url=${STORAGE_NODES_1_BASE_URL:http://localhost:9002}
storage.nodes[2].id=${STORAGE_NODES_2_ID:node-3}
storage.nodes[2].base-url=${STORAGE_NODES_2_BASE_URL:http://localhost:9003}
